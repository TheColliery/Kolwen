version: 2

# Carries the flock template's `assignees` block: every bump PR is assigned to the maintainer for
# the notification, so a bump that does not auto-merge (a red check, a major version) is seen.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # One fixed weekly slot, the same in every repository of the organization.
      day: thursday
      time: "11:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    assignees:
      - HetCreep
    # ONE weekly PR for every action bump, whatever its size. Two PRs that touch the same
    # workflow file race: the first merges, the second is then behind main and GitHub
    # refuses its auto-merge (GITHUB_TOKEN may not write workflow content outside its own
    # diff). Any second group re-opens that race, so there is one. A group holding a major
    # bump reads as major and waits for a human (the auto-merge allowlist); the group also
    # keeps every github/codeql-action/* path in step (a split init/analyze bump reds CodeQL).
    groups:
      github-actions:
        patterns:
          - "*"
    # NO pip ecosystem, deliberately: the package has zero runtime dependencies. The only pinned
    # Python packages are the release build toolchain in py/requirements-build.txt, a GENERATED,
    # hash-pinned file (edit py/requirements-build.in and regenerate; the command is in that
    # file's header, and hatchling's pin in py/pyproject.toml moves with it). Whether Dependabot
    # should watch that file has not been decided or tested, so it is bumped by hand for now.
    # Add a pip block the day the package gains a runtime dependency or that is decided.
  - package-ecosystem: npm
    directory: /
    # DAILY, not weekly (owner ruling, 2026-09-23) -- `package.json` pins wrangler,
    # the tool Workers Previews depends on (LWK-198); a daily schedule catches a patch/minor as
    # soon as it ships rather than waiting up to a week. Patch/minor auto-merge once CI is green,
    # under the same `dependabot-auto-merge.yml` carve-out the github-actions ecosystem already
    # uses -- that workflow gates on the actor and on update-type alone, with no ecosystem
    # filter, so it already covers this block with no edit.
    schedule:
      interval: daily
    commit-message:
      prefix: build
    assignees:
      - HetCreep
