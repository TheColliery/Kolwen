name: Publish to PyPI

# Manual or tag-driven only. Never on every push — PyPI refuses a version that
# already exists, so a push trigger would turn every commit into a red run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The py-v* tag to publish. Must be a signed annotated tag."
        required: true
        type: string
  push:
    tags: ["py-v*"]

# cancel-in-progress: FALSE, and this is the strongest never-cancel in this repository.
# PyPI refuses a re-upload of a version that already exists, so a publish killed midway is NOT
# retryable at that version -- the only recovery is a version bump. Queue instead of cancel.
# The group is deliberately CONSTANT, not per-ref: a tag push and a manual dispatch can target
# the same version from different refs, and only one publish may be in flight repository-wide.
concurrency:
  group: publish-pypi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # A job-level `permissions:` block REPLACES the workflow-level one, it never merges with it
    # (LWK-168). Without `contents: read` here, `contents` is `none` inside this job and the gate's
    # two API calls (git/ref/tags, git/tags) cannot read the tag: the release path would fail on
    # its first real run. Do not "tidy" this back to id-token alone.
    permissions:
      contents: read
      id-token: write # Trusted Publishing — no API token stored anywhere
    steps:
      # ── THE GATE: only a SIGNED ANNOTATED tag may publish. Fail-closed, every branch. ─────────
      # LWK-135. A publish is irreversible at its version, so "who authorised this exact tree" is
      # answered before anything is built, never after.
      #
      # A LIGHTWEIGHT tag is a ref pointing straight at a commit: no tag object, nothing signed,
      # nobody attributable. It FAILS here.
      # An ANNOTATED tag has an object of type `tag`, and GitHub reports whether its signature
      # verifies. `verified: false` FAILS -- including reason `unsigned`, and `unknown_key`, which
      # means the signing key is not registered on the account as a SIGNING key.
      # Any API error FAILS. There is no "could not check, proceeding" branch, by design.
      - name: Require a signed annotated tag
        id: gate
        env:
          # Through the environment, never interpolated into the script: a workflow_dispatch input
          # is attacker-influenced text, and inlining it is the script-injection shape we ban.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^py-v[A-Za-z0-9._-]+$' || {
            echo "::error::refusing to publish: '$TAG' is not a py-v* tag name"; exit 1; }

          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
                    -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }

          ref_json=$(api "git/ref/tags/$TAG") || {
            echo "::error::refusing to publish: cannot resolve tag $TAG at the API"; exit 1; }
          obj_type=$(printf '%s' "$ref_json" | jq -r '.object.type')
          obj_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha')

          if [ "$obj_type" != "tag" ]; then
            echo "::error::refusing to publish: $TAG is a LIGHTWEIGHT tag -- no tag object, the ref points straight at a $obj_type. A release tag must be annotated and signed."
            exit 1
          fi

          tag_json=$(api "git/tags/$obj_sha") || {
            echo "::error::refusing to publish: cannot read the tag object for $TAG"; exit 1; }
          verified=$(printf '%s' "$tag_json" | jq -r '.verification.verified')
          reason=$(printf '%s' "$tag_json" | jq -r '.verification.reason')
          commit=$(printf '%s' "$tag_json" | jq -r '.object.sha')

          echo "tag=$TAG object=$obj_sha commit=$commit verified=$verified reason=$reason"
          if [ "$verified" != "true" ]; then
            echo "::error::refusing to publish: $TAG is annotated but its signature does not verify (reason: $reason). If that reads unknown_key, register the signing key on the account as a SIGNING key, or re-sign the tag. The gate is not the thing to soften."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$TAG is a signed annotated tag, verified. Publishing the tree at $commit."

      # persist-credentials: false — nothing after this step runs a git operation that needs the
      # token (the build reads files; the publish goes through OIDC), so it is not left in
      # .git/config for any later step to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.commit }}
          persist-credentials: false

      # ── THE VERSION GUARD: a release tag must NAME the version the tree actually builds. ─────
      # LWK-168. The gate above proves who signed the tag; it says nothing about whether the tag
      # and py/pyproject.toml agree. Without this, a signed py-v0.1.0 over a tree still declaring
      # some other version builds and uploads THAT version to real PyPI -- permanently, at a
      # version that then can never carry the right release. Fail-closed: a version this step
      # cannot read (dynamic, single-quoted, absent) is a refusal, never a pass.
      # Scoped to a clean py-vX.Y.Z tag, the only shape that reaches real PyPI (see the target
      # step below); every other tag goes to TestPyPI, where a mismatch burns nothing that matters.
      # The tag comes through the environment, never interpolated into the script.
      - name: Require the tag to match the built version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if printf '%s' "$TAG" | grep -Eq '^py-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            want="${TAG#py-v}"
            have=$(awk '/^\[/ { p = ($0 == "[project]") } p && /^version[[:space:]]*=/ { gsub(/^[^"]*"|"[^"]*$/, ""); print; exit }' py/pyproject.toml)
            if [ "$have" != "$want" ]; then
              echo "::error::refusing to publish: $TAG names version $want but py/pyproject.toml declares '${have:-<none readable>}'. Bump the version in a commit, then cut the tag from that commit."
              exit 1
            fi
            echo "$TAG matches py/pyproject.toml version $have."
          else
            echo "$TAG is not a clean release tag; it goes to TestPyPI, version guard not applied."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The toolchain is installed from requirements-build.txt, generated with hashes for build AND
      # the hatchling backend and its whole closure (LWK-177). --no-isolation makes the build use
      # THAT installed, hashed backend: build isolation would resolve its own, unhashed one from
      # pyproject's [build-system].requires, so the hash set would not cover what actually builds.
      # The exact hatchling pin in pyproject must equal the one in requirements-build.in; if the two
      # disagree the build stops with "Unmet dependencies" rather than building with another backend.
      - name: Build
        working-directory: py
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m build --no-isolation

      # WHERE THIS PUBLISHES, decided fail-safe: ONLY a clean release tag (py-vX.Y.Z, digits
      # only) reaches real PyPI. Everything else — a PEP 440 pre-release or .devN, a tag with
      # a word in it, and every workflow_dispatch, where ref_name is a BRANCH and not a
      # version at all — goes to TestPyPI.
      #
      # The direction matters more than the cleverness: a wrong TestPyPI upload is harmless,
      # a wrong PyPI upload is PERMANENT and can never be re-uploaded or reclaimed. The
      # previous expression tested the whole ref for the letters a/b/rc, which sent
      # py-v0.1.0.dev1 to real PyPI and every dispatch from `main` (it contains an 'a') to
      # TestPyPI — wrong in both directions.
      - name: Decide publish target
        id: target
        env:
          # Never interpolate a ref into a shell string: that is the script-injection shape the
          # flock's dangerous-workflow rule bans. Through the environment it is data, not code.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && printf '%s' "$REF_NAME" | grep -Eq '^py-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'url=' >> "$GITHUB_OUTPUT"
            echo "release tag $REF_NAME -> real PyPI"
          else
            echo 'url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
            echo "$REF_TYPE $REF_NAME is not a clean release tag -> TestPyPI"
          fi


      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: py/dist
          repository-url: ${{ steps.target.outputs.url }}
