name: Publish to PyPI

# Manual or tag-driven only. Never on every push — PyPI refuses a version that
# already exists, so a push trigger would turn every commit into a red run.
on:
  workflow_dispatch:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing — no API token stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build
        working-directory: py
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: py/dist
          # A PRE-RELEASE tag (py-v0.0.1a0, py-v1.2.3rc1, py-v0.2.0b1) publishes to TestPyPI;
          # a plain release tag goes to real PyPI. This exists so the release path can be
          # EXERCISED before it is trusted: it has never run once — this repo has zero tags,
          # and the 0.0.0 currently on PyPI was hand-built and uploaded outside this workflow.
          # An empty repository-url is the action's default (real PyPI), so the plain-tag
          # path is unchanged by this addition.
          repository-url: ${{ (contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc')) && 'https://test.pypi.org/legacy/' || '' }}
