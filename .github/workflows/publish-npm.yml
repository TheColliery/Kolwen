name: Publish to npm

# Manual or tag-driven only. Never on every push: npm refuses a version that already exists,
# so a push trigger would turn every commit into a red run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The npm-v* tag to publish. Must be a signed annotated tag."
        required: true
        type: string
  push:
    tags: ["npm-v*"]

# cancel-in-progress: FALSE. npm refuses a re-publish of a version that already exists, so a
# publish killed midway is not retryable at that version -- the only recovery is a version bump.
# Queue instead of cancel. The group is deliberately CONSTANT, not per-ref, so one publish is in
# flight repository-wide, the same rule as publish-pypi.yml.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # never run yet, so unmeasured: an upper guess
    environment: npm
    # A job-level `permissions:` block REPLACES the workflow-level one, it never merges with it.
    # Without `contents: read` here, `contents` is `none` inside this job and the gate's two API
    # calls (git/ref/tags, git/tags) cannot read the tag: the release path would fail on its first
    # real run. Do not "tidy" this back to id-token alone.
    permissions:
      contents: read
      id-token: write # Trusted Publishing: npm exchanges this GitHub OIDC token for a publish credential. No API token is stored anywhere.
    steps:
      # ── THE GATE: only a SIGNED ANNOTATED tag may publish. Fail-closed, every branch. ─────────
      # A publish is irreversible at its version, so "who authorised this exact tree" is answered
      # before anything is built, never after.
      #
      # A LIGHTWEIGHT tag is a ref pointing straight at a commit: no tag object, nothing signed,
      # nobody attributable. It FAILS here.
      # An ANNOTATED tag has an object of type `tag`, and GitHub reports whether its signature
      # verifies. `verified: false` FAILS -- including reason `unsigned`, and `unknown_key`, which
      # means the signing key is not registered on the account as a SIGNING key.
      # Any API error FAILS. There is no "could not check, proceeding" branch, by design.
      - name: Require a signed annotated tag
        id: gate
        env:
          # Through the environment, never interpolated into the script: a workflow_dispatch input
          # is attacker-influenced text, and inlining it is the script-injection shape we ban.
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^npm-v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::refusing to publish: '$TAG' is not an npm-vX.Y.Z tag name"; exit 1; }

          api() { curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
                    -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }

          ref_json=$(api "git/ref/tags/$TAG") || {
            echo "::error::refusing to publish: cannot resolve tag $TAG at the API"; exit 1; }
          obj_type=$(printf '%s' "$ref_json" | jq -r '.object.type')
          obj_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha')

          if [ "$obj_type" != "tag" ]; then
            echo "::error::refusing to publish: $TAG is a LIGHTWEIGHT tag -- no tag object, the ref points straight at a $obj_type. A release tag must be annotated and signed."
            exit 1
          fi

          tag_json=$(api "git/tags/$obj_sha") || {
            echo "::error::refusing to publish: cannot read the tag object for $TAG"; exit 1; }
          verified=$(printf '%s' "$tag_json" | jq -r '.verification.verified')
          reason=$(printf '%s' "$tag_json" | jq -r '.verification.reason')
          commit=$(printf '%s' "$tag_json" | jq -r '.object.sha')

          echo "tag=$TAG object=$obj_sha commit=$commit verified=$verified reason=$reason"
          if [ "$verified" != "true" ]; then
            echo "::error::refusing to publish: $TAG is annotated but its signature does not verify (reason: $reason). If that reads unknown_key, register the signing key on the account as a SIGNING key, or re-sign the tag. The gate is not the thing to soften."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "$TAG is a signed annotated tag, verified. Publishing the tree at $commit."

      # persist-credentials: false -- nothing after this step runs a git operation that needs the
      # token (the build reads files; the publish goes through OIDC), so it is not left in
      # .git/config for any later step to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.gate.outputs.commit }}
          persist-credentials: false

      # Node 24.22.2 bundles npm 11.19.1 (nodejs.org/dist/index.json, read 2026-11-03). Both clear
      # the npm docs' floor for trusted publishing (npm CLI 11.5.1, Node 22.14.0), so no npm is
      # downloaded at publish time. No registry-url here: setup-node would write an .npmrc line
      # that reads a token variable, and this job carries no token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false # never cache in a release build

      - name: Assert the Node and npm versions trusted publishing needs
        run: |
          set -euo pipefail
          node_v="$(node --version | sed 's/^v//')"
          npm_v="$(npm --version)"
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$2" ]; }
          at_least "$node_v" 22.14.0 || { echo "::error::refusing to publish: Node $node_v is older than 22.14.0"; exit 1; }
          at_least "$npm_v" 11.5.1 || { echo "::error::refusing to publish: npm $npm_v is older than 11.5.1"; exit 1; }
          echo "node $node_v, npm $npm_v: trusted publishing is supported."

      # ── THE VERSION GUARD: a release tag must NAME the version npm/package.json declares. ─────
      # The gate above proves who signed the tag; it does not prove that the tag and the package
      # agree. Without this, a signed npm-v0.0.3 over a tree that still declares 0.0.2 would try to
      # publish 0.0.2 -- or, if 0.0.2 already exists, fail after the gate, which is the safer half.
      # The check itself is scripts/npm-release-guard.mjs, tested by scripts/npm-release-guard.test.mjs.
      - name: Require the tag to match npm/package.json
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/npm-release-guard.mjs "$TAG" npm/package.json

      # ── THE PUBLISH. NO token anywhere in this job: no NODE_AUTH_TOKEN, no .npmrc token. ──────
      # The registry is named on the command line. Provenance is generated automatically for a
      # public package published from a public repository through Trusted Publishing, so no
      # --provenance flag and no --provenance-file are passed.
      - name: Publish
        working-directory: npm
        run: npm publish --registry=https://registry.npmjs.org/
