<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{notfound.meta.title}}</title>
<meta name="robots" content="noindex">
{{block:site-fonts}}
<style>
:root{--ink:#1a1a1a;--dim:#5b5b5b;--bg:#fbfaf8;--amber:#A65A19}
@media (prefers-color-scheme:dark){:root{--ink:#f2f0ed;--dim:#a3a3a3;--bg:#141414;--amber:#e8833a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);
  font:16px/1.65 "KW Sans Thai",system-ui,-apple-system,sans-serif}
main{flex:1 0 auto;width:100%;max-width:38rem;margin:0 auto;padding:2rem;display:flex;flex-direction:column;justify-content:center}
h1{font-size:1.35rem;margin:0 0 .75rem;font-weight:600}
p{margin:0 0 .6rem;color:var(--dim)}
.th{margin-top:1.6rem;padding-top:1.2rem;border-top:1px solid color-mix(in srgb,var(--dim) 25%,transparent)}
a{color:var(--amber)}
{{block:site-header-css}}
{{block:site-footer-css}}
</style>
<noscript><style>
{{block:site-noscript-css}}
</style></noscript>
</head>
<body>
{{block:site-header}}
<main>
  <div id="doc-en" lang="en">
{{lang en}}
  <h1>{{notfound.title}}</h1>
  <p>{{notfound.body}}</p>
  <p><a href="/">{{notfound.home}}</a></p>
{{/lang}}
  </div>
  <div class="th" id="doc-th" lang="th" hidden>
{{lang th}}
    <h1>{{notfound.title}}</h1>
    <p>{{notfound.body}}</p>
    <p><a href="/">{{notfound.home}}</a></p>
{{/lang}}
  </div>
</main>
{{block:site-footer:en}}
{{block:site-footer:th}}
{{raw:script}}
</body>
</html>
